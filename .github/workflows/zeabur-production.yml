name: Fork Production Image and Zeabur Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeabur-production-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/omniroute
  IMAGE_TAG: sha-${{ github.sha }}
  ZEABUR_CLI_VERSION: "0.21.0"

jobs:
  build:
    name: Build immutable runner-base image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable tag
        id: image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing immutable image: $IMAGE_REF"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Building new immutable image: $IMAGE_REF"
          fi

      - name: Build and push runner-base
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: runner-base
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=zeabur-runner-base-amd64
          cache-to: type=gha,mode=max,scope=zeabur-runner-base-amd64
          provenance: mode=max
          sbom: true

      - name: Record image reference
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          printf '### Production image\n\n`%s`\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Update existing Zeabur Docker Service
    needs: build
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: production
    steps:
      - name: Detect optional Zeabur configuration
        id: zeabur-config
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_SERVICE_ID: ${{ secrets.ZEABUR_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -n "$ZEABUR_TOKEN" ] && [ -n "$ZEABUR_SERVICE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZEABUR_TOKEN or ZEABUR_SERVICE_ID is missing; image build succeeded and deployment was skipped."
          fi

      - name: Update Zeabur image tag
        if: steps.zeabur-config.outputs.configured == 'true'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_SERVICE_ID: ${{ secrets.ZEABUR_SERVICE_ID }}
        run: |
          set -euo pipefail
          npx --yes "zeabur@${ZEABUR_CLI_VERSION}" auth login -i=false
          npx --yes "zeabur@${ZEABUR_CLI_VERSION}" service update tag \
            --id "$ZEABUR_SERVICE_ID" \
            -t "$IMAGE_TAG" \
            -y \
            -i=false

      - name: Record skipped deployment
        if: steps.zeabur-config.outputs.configured != 'true'
        run: |
          printf '### Zeabur deployment\n\nSkipped: configure `ZEABUR_TOKEN` and `ZEABUR_SERVICE_ID` in the `production` environment.\n' >> "$GITHUB_STEP_SUMMARY"
