name: GHCR runner-web (linux/amd64)

on:
  push:
    branches:
      - main
      # Validate the upstream merge before promoting it to main.
      - codex/sync-upstream-20261010

permissions:
  contents: read

concurrency:
  group: ghcr-runner-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'lywx215/OmniRoute'
    name: Validate and publish the single Zeabur image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/lywx215/omniroute:sha-${{ github.sha }}-web
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Playwright packaging and workflow regressions
        run: >-
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts
          --import ./tests/_setup/isolateDataDir.ts --test
          tests/unit/build/assemble-standalone.test.ts
          tests/unit/gemini-web-missing-browser-3516.test.ts
          tests/unit/ghcr-runner-web-workflow.test.ts

      - name: Lint
        run: npm run lint

      - name: Core types
        run: npm run typecheck:core

      - name: Node unit tests
        run: npm run test:unit

      - name: Vitest
        run: npm run test:vitest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only runner-web for linux/amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runner-web
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/lywx215/OmniRoute
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=6144
            OMNIROUTE_BUILD_WORKERS=1
          cache-from: type=gha,scope=ghcr-runner-web-amd64
          cache-to: type=gha,scope=ghcr-runner-web-amd64,mode=max,ignore-error=true
          provenance: false
          sbom: false

      - name: Verify the exact image before publishing
        run: node scripts/ci/verify-runner-web-image.mjs "$IMAGE_REF"

      - name: Publish the validated image
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"
          printf '### Verified Zeabur image\n\n`%s`\n\nPlatform: linux/amd64\nTarget: runner-web\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
